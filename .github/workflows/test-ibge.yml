
name: Verificar catalogo nacional do IBGE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ibge-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar leitor da planilha
        run: |
          python -m pip install --upgrade pip
          pip install xlrd==2.0.1

      - name: Inspecionar planilha oficial de municipios
        run: |
          python - <<'PY'
          import io
          import urllib.request
          import zipfile
          import xlrd

          ZIP_URL = (
              "https://geoftp.ibge.gov.br/"
              "organizacao_do_territorio/"
              "estrutura_territorial/"
              "divisao_territorial/"
              "2025/DTB_2025.zip"
          )

          XLS_NAME = "RELATORIO_DTB_BRASIL_2025_MUNICIPIOS.xls"

          print("Baixando catalogo oficial DTB 2025...")

          request = urllib.request.Request(
              ZIP_URL,
              headers={"User-Agent": "BuscaVagasBot/0.1"},
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              print("HTTP:", response.status)
              zip_data = response.read()

          print("Bytes recebidos:", len(zip_data))

          with zipfile.ZipFile(io.BytesIO(zip_data)) as archive:
              bad_file = archive.testzip()

              if bad_file:
                  raise RuntimeError(
                      f"Arquivo ZIP corrompido: {bad_file}"
                  )

              matches = [
                  name for name in archive.namelist()
                  if name.endswith(XLS_NAME)
              ]

              if len(matches) != 1:
                  raise RuntimeError(
                      f"Planilha nao encontrada: {matches}"
                  )

              xls_data = archive.read(matches[0])

          workbook = xlrd.open_workbook(
              file_contents=xls_data,
              on_demand=False,
          )

          print("\n=== ABAS DA PLANILHA ===")

          for sheet in workbook.sheets():
              print(
                  f"Aba: {sheet.name} | "
                  f"Linhas: {sheet.nrows} | "
                  f"Colunas: {sheet.ncols}"
              )

          sheet = workbook.sheet_by_name("DTB_Municípios")

          print("\n=== PRIMEIRAS 15 LINHAS ORIGINAIS ===")
          print("Aba:", sheet.name)

          for row_index in range(min(15, sheet.nrows)):
              print(f"\nLINHA {row_index + 1}:")

              for col_index in range(sheet.ncols):
                  cell = sheet.cell(row_index, col_index)
                  value = cell.value

                  print(
                      f"Coluna {col_index + 1}: "
                      f"valor={value!r} | "
                      f"tipo={cell.ctype}"
                  )

          print("\n=== RESUMO DOS CABECALHOS ===")

          for row_index in range(min(15, sheet.nrows)):
              values = [
                  str(sheet.cell_value(row_index, col)).strip()
                  for col in range(sheet.ncols)
              ]

              print(
                  f"Linha {row_index + 1}: "
                  + " | ".join(values)
              )

          print("\n=== FIM DA INSPECAO ===")
          PY

      - name: Instalar dependencias do projeto
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Executar testes reais do IBGE
        env:
          RUN_LIVE_IBGE_TESTS: "1"
        run: python -m pytest -q tests/test_ibge_live.py
        
