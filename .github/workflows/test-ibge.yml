name: Verificar catalogo nacional do IBGE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ibge-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validar catalogo real do IBGE
        env:
          RUN_LIVE_IBGE_TESTS: "1"
        run: python -m pytest -q tests/test_ibge_live.py
