
name: Suite completa de testes do Robo 2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Executar todos os testes locais
        env:
          DATABASE_URL: ""
        run: |
          python -m pytest -q test_sources_persistence.py test_sources_auth.py test_source_registry.py test_url_normalization.py test_migration_safety.py
