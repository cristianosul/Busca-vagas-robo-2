
name: Testar cadastro de fontes do Robo 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Testar cadastro de fontes
        env:
          DATABASE_URL: ""
        run: |
          python -m pytest -q test_source_registry.py
          
