
name: Neon Integration Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neon-integration:
    name: Test real PostgreSQL / Neon
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuração do Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure o segredo NEON_DATABASE_URL nas configurações do GitHub."
            exit 1
          fi

      - name: Executar integração real
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          PYTHONPATH: .
        run: |
          python tests/test_neon.py
          
