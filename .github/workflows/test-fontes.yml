
name: Testes de persistência das fontes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Executar testes das fontes
        env:
          DATABASE_URL: ""
        run: |
          python -m pytest -q test_sources_persistence.py test_sources_auth.py
