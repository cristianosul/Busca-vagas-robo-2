name: Testar triagem do Robo 2 no Neon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar teste de triagem no Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure o segredo NEON_DATABASE_URL nas configuracoes do GitHub."
            exit 1
          fi

          python test_triagem_neon.py
          
